name: Deploy Next frontend
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - next-frontend/**
      - .github/workflows/deploy-next-frontend.yml

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to vercel
        id: deploy-vercel

        # Temp workaround for issue: https://github.com/amondnet/vercel-action/issues/78#issuecomment-940843410
        uses: andyrichardson/vercel-action@v21

        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Clean up stale vercel deployments
        env:
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          output=$(npx vercel remove "${VERCEL_PROJECT_NAME}" --scope="${VERCEL_SCOPE}" --token="${VERCEL_TOKEN}" --safe --yes 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qi "could not find unaliased deployments or projects"; then
            echo "No stale deployments to remove — nothing to clean up."
            exit 0
          fi
          echo "vercel remove failed (exit $code)."
          exit "$code"
